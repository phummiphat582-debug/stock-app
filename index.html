<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบสต็อกกิจกรรม - Enterprise UI V9</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#245a92">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBo8aIL2e1XLdS4BeOPEreXaA3IyWDTiHY",
    authDomain: "stock-69302.firebaseapp.com",
    projectId: "stock-69302",
    storageBucket: "stock-69302.firebasestorage.app",
    messagingSenderId: "301831402512",
    appId: "1:301831402512:web:290a578b80c199314bc695"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
</script>

<style>
/* ====== CSS เดิมทั้งหมด ====== */
*{box-sizing:border-box;font-family:'Segoe UI','Prompt',sans-serif;}
body{margin:0;background:#edf1f7;color:#1f2933;}
:root{--primary:#245a92;--primary-soft:#e4edf9;--sidebar:#1f3554;--accent:#ff8c42;}
header{background:linear-gradient(90deg,#23466f,#245a92);color:white;padding:14px 22px;font-size:20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(15,23,42,0.35);position:sticky;top:0;z-index:10;}
header .title{display:flex;align-items:center;gap:10px;font-weight:600;}
header .logo{width:34px;height:34px;border-radius:12px;background:#ffffff22;display:flex;align-items:center;justify-content:center;font-size:20px;}
.layout{display:flex;min-height:calc(100vh - 62px);}
.sidebar{width:240px;background:var(--sidebar);color:#e4ecf5;padding:18px 12px;display:flex;flex-direction:column;gap:18px;box-shadow:4px 0 12px rgba(15,23,42,0.35);}
.nav-section-title{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;opacity:0.7;margin:4px 0 8px 6px;}
.nav-btn{width:100%;text-align:left;padding:10px 12px;border-radius:16px;border:none;background:transparent;color:#e4ecf5;display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;}
.nav-btn.active{background:#284874;}
.main{flex:1;padding:18px 20px;overflow:auto;}
.section{display:none;}
.section.active{display:block;}
.section-title{font-size:20px;font-weight:600;margin:4px 0 8px;color:var(--primary);}
.section-subtitle{font-size:13px;color:#6b7280;margin-bottom:14px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
.card{background:#fff;border-radius:18px;padding:18px 20px;border:1px solid #dde4ef;box-shadow:0 10px 25px rgba(15,23,42,0.10);}
.stat-label{font-size:13px;color:#6b7280;}
.stat-value{font-size:24px;font-weight:600;margin-top:4px;color:#111827;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
input,select,textarea{width:100%;padding:9px 10px;border-radius:9px;border:1px solid #c5ced9;}
button{padding:9px 16px;border:none;border-radius:999px;cursor:pointer;}
.btn-primary{background:var(--primary);color:white;}
.btn-outline{background:white;border:1px solid var(--primary);color:var(--primary);}
.btn-out{background:var(--accent);color:white;}
table{width:100%;border-collapse:collapse;margin-top:10px;}
th,td{padding:9px;border:1px solid #d0d7e0;font-size:13px;}
th{background:#e1e8f0;}
</style>
</head>

<body>
<header>
  <div class="title">
    <div class="logo">📦</div>
    <div>
      <div>ระบบสต็อกกิจกรรม</div>
      <div class="subtitle">เวอร์ชันองค์กร V9 – สต็อก, เบิก, สรุปยอด</div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <button class="nav-btn active" data-view="dashboard">📊 Dashboard</button>
    <button class="nav-btn" data-view="stock">📦 สต็อก</button>
    <button class="nav-btn" data-view="add">➕ เพิ่ม</button>
    <button class="nav-btn" data-view="issue">📤 เบิก</button>
    <button class="nav-btn" data-view="history">📜 ประวัติ</button>
  </aside>

  <main class="main">
    <section id="view-dashboard" class="section active">
      <div class="section-title">ภาพรวมสต็อก</div>
      <div class="grid">
        <div class="card"><div class="stat-label">จำนวนรายการ</div><div id="stat_total_items" class="stat-value">0</div></div>
        <div class="card"><div class="stat-label">จำนวนรวม</div><div id="stat_total_qty" class="stat-value">0</div></div>
        <div class="card"><div class="stat-label">มูลค่ารวม</div><div id="stat_total_value" class="stat-value">0</div></div>
        <div class="card"><div class="stat-label">ใกล้หมด</div><div id="stat_low_stock" class="stat-value">0</div></div>
      </div>
    </section>

    <section id="view-stock" class="section">
      <div class="section-title">สต็อก</div>
      <table>
        <thead><tr><th>ชื่อ</th><th>จำนวน</th><th>ราคา</th><th>การกระทำ</th></tr></thead>
        <tbody id="stockTable"></tbody>
      </table>
    </section>

    <section id="view-add" class="section">
      <div class="section-title">เพิ่มสินค้า</div>
      <input id="name" placeholder="ชื่อ">
      <input id="qty" type="number" placeholder="จำนวน">
      <input id="price" type="number" placeholder="ราคา">
      <button class="btn-primary" id="btnSaveItem">บันทึก</button>
    </section>

    <section id="view-issue" class="section">
      <div class="section-title">เบิก</div>
      <select id="use_name"></select>
      <input id="use_qty" type="number" placeholder="จำนวน">
      <input id="use_by" placeholder="ผู้เบิก">
      <input id="use_date" type="date">
      <button class="btn-out" id="btnUseItem">บันทึกเบิก</button>
    </section>

    <section id="view-history" class="section">
      <div class="section-title">ประวัติ</div>
      <div id="useHistory"></div>
    </section>
  </main>
</div>

<script>
let items = [];
let historyData = [];

/* ===== Navigation ===== */
document.querySelectorAll(".nav-btn").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
    document.getElementById("view-"+btn.dataset.view).classList.add("active");
  };
});

/* ===== Render ===== */
function renderStock(){
  const tb = document.getElementById("stockTable");
  tb.innerHTML="";
  items.forEach((x,idx)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${x.name}</td><td>${x.qty}</td><td>${x.price}</td>
      <td><button onclick="delItem(${idx})">ลบ</button></td>`;
    tb.appendChild(tr);
  });
}
function renderDash(){
  document.getElementById("stat_total_items").innerText=items.length;
  document.getElementById("stat_total_qty").innerText=items.reduce((s,x)=>s+x.qty,0);
  document.getElementById("stat_total_value").innerText=items.reduce((s,x)=>s+x.qty*x.price,0).toFixed(2);
  document.getElementById("stat_low_stock").innerText=items.filter(x=>x.qty<=5).length;
}
function renderHistory(){
  const div=document.getElementById("useHistory");
  div.innerHTML="";
  historyData.forEach(h=>{
    div.innerHTML+=`<div>${h.name} เบิก ${h.qty} โดย ${h.by}</div>`;
  });
}
function updateDropdown(){
  const sel=document.getElementById("use_name");
  sel.innerHTML="";
  items.forEach(x=>{
    const o=document.createElement("option");
    o.value=x.name; o.textContent=x.name;
    sel.appendChild(o);
  });
}

/* ===== Realtime Firestore ===== */
function listenRealtime(){
  db.collection("items").onSnapshot(snap=>{
    items = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderStock(); renderDash(); updateDropdown();
  });
  db.collection("history").orderBy("time","desc").onSnapshot(snap=>{
    historyData = snap.docs.map(d=>d.data());
    renderHistory();
  });
}

/* ===== Actions ===== */
btnSaveItem.onclick=()=>{
  const n=name.value.trim();
  const q=Number(qty.value)||0;
  const p=Number(price.value)||0;
  if(!n) return;
  const ex=items.find(x=>x.name===n);
  if(ex){
    db.collection("items").doc(ex.id).update({qty:ex.qty+q,price:p});
  }else{
    db.collection("items").add({name:n,qty:q,price:p});
  }
  name.value=qty.value=price.value="";
};

btnUseItem.onclick=()=>{
  const n=use_name.value;
  const q=Number(use_qty.value)||0;
  const by=use_by.value;
  const d=use_date.value;
  const it=items.find(x=>x.name===n);
  if(!it||it.qty<q) return;
  db.collection("items").doc(it.id).update({qty:it.qty-q});
  db.collection("history").add({name:n,qty:q,by:by,date:d,time:firebase.firestore.FieldValue.serverTimestamp()});
  use_qty.value=use_by.value="";
};

function delItem(i){
  const it=items[i];
  if(it) db.collection("items").doc(it.id).delete();
}

/* Init */
listenRealtime();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js');
  });
}
</script>

</body>
</html>
