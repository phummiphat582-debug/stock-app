<style>

<body>
<!-- ===== HTML เดิมของคุณทั้งหมด (ไม่เปลี่ยน) ===== -->
<!-- ... (ส่วน HTML คงเดิมเหมือนที่คุณส่งมา) ... -->

<script>
var items = [];
var historyData = [];

/* ===== Popup เดิม ===== */
function showPopup(t,c,isHtml){
  popupTitle.innerText=t||"แจ้งเตือน";
  if(isHtml) popupBody.innerHTML=c; else popupBody.innerText=c;
  popupOverlay.style.display="flex";
}
function hidePopup(){ popupOverlay.style.display="none"; }

/* ===== Firestore Realtime ===== */
function listenRealtime(){
  db.collection("items").onSnapshot(snap=>{
    items = snap.docs.map(d=>({id:d.id,...d.data()}));
    updateDropdown();
    renderStock();
    renderDashboard();
  });

  db.collection("history").orderBy("time","desc").onSnapshot(snap=>{
    historyData = snap.docs.map(d=>{
      let x=d.data();
      if(x.time && x.time.toDate) x.time=x.time.toDate().toLocaleString();
      return x;
    });
    renderHistory();
  });
}

/* ===== ฟังก์ชัน render / dropdown / dashboard / history ===== */
/* (ใช้ของเดิมคุณทั้งหมด ไม่เปลี่ยน) */

/* ===== Save item → Firestore ===== */
function saveItem(){
  var n=name.value.trim();
  var q=Number(qty.value)||0;
  var p=Number(price.value)||0;
  var t=Number(threshold.value)||0;
  var d=date_add.value;
  var noteVal=note.value.trim();
  if(!n){showPopup("แจ้งเตือน","กรุณากรอกชื่ออุปกรณ์");return;}

  var ex=items.find(x=>x.name===n);
  if(ex){
    db.collection("items").doc(ex.id).update({
      qty:(Number(ex.qty)||0)+q,price:p,threshold:t,date_add:d,note:noteVal
    });
  }else{
    db.collection("items").add({
      name:n,qty:q,price:p,threshold:t,date_add:d,note:noteVal
    });
  }
  clearAddForm();
  showPopup("สำเร็จ","บันทึกข้อมูลอุปกรณ์เรียบร้อยแล้ว");
}

/* ===== Use item ===== */
function useItem(){
  var n=use_name.value;
  var q=Number(use_qty.value)||0;
  var by=use_by.value.trim();
  var d=use_date.value;
  var noteVal=use_note.value.trim();
  if(!n||!by||!d){showPopup("แจ้งเตือน","กรอกข้อมูลให้ครบ");return;}

  var it=items.find(x=>x.name===n);
  if(!it||it.qty<q){showPopup("แจ้งเตือน","สินค้าไม่พอ");return;}

  db.collection("items").doc(it.id).update({qty:it.qty-q});
  db.collection("history").add({
    name:n,qty:q,by:by,date:d,note:noteVal,
    time:firebase.firestore.FieldValue.serverTimestamp()
  });
  clearIssueForm();
  showPopup("สำเร็จ ✔","บันทึกการเบิกสินค้าเรียบร้อยแล้ว");
}

/* ===== Delete ===== */
function deleteItemByIndex(idx){
  var it=items[idx];
  if(it && confirm("ต้องการลบ '"+it.name+"' ?")){
    db.collection("items").doc(it.id).delete();
  }
}

/* ===== Edit save ===== */
btnSaveEdit.addEventListener("click",()=>{
  var idx=Number(edit_index.value);
  var it=items[idx];
  if(!it) return;
  db.collection("items").doc(it.id).update({
    name:edit_name.value.trim(),
    price:Number(edit_price.value)||0,
    threshold:Number(edit_threshold.value)||0,
    note:edit_note.value.trim()
  });
  popupEdit.style.display="none";
  showPopup("สำเร็จ","แก้ไขสินค้าเรียบร้อยแล้ว");
});

/* ===== Init ===== */
document.addEventListener("DOMContentLoaded",()=>{
  btnClosePopup.onclick=hidePopup;
  btnSaveItem.onclick=saveItem;
  btnUseItem.onclick=useItem;
  setupNav();
  listenRealtime(); // 👈 ใช้ realtime แทน localStorage
});
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js');
