<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบสต็อกกิจกรรม - Realtime</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:sans-serif;background:#edf1f7;margin:0;padding:20px}
h2{color:#245a92}
input,select,textarea,button{padding:8px;margin:4px 0;width:100%}
button{background:#245a92;color:#fff;border:0;border-radius:6px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:6px;font-size:14px}
</style>
</head>
<body>

<h2>📦 ระบบสต็อกกิจกรรม (Realtime)</h2>

<h3>เพิ่มสินค้า</h3>
<input id="name" placeholder="ชื่ออุปกรณ์">
<input id="qty" type="number" placeholder="จำนวน">
<input id="price" type="number" placeholder="ราคา/หน่วย">
<input id="threshold" type="number" placeholder="แจ้งเตือน ≤">
<input id="date_add" type="date">
<textarea id="note" placeholder="หมายเหตุ"></textarea>
<button id="btnSaveItem">บันทึกสินค้า</button>

<h3>เบิกสินค้า</h3>
<select id="use_name"></select>
<input id="use_qty" type="number" placeholder="จำนวนที่เบิก">
<input id="use_by" placeholder="ผู้เบิก">
<input id="use_date" type="date">
<textarea id="use_note" placeholder="หมายเหตุ"></textarea>
<button id="btnUseItem">บันทึกการเบิก</button>

<h3>สต็อกคงเหลือ</h3>
<table>
<thead>
<tr>
<th>ชื่อ</th><th>จำนวน</th><th>ราคา</th><th>รวม</th><th>ลบ</th>
</tr>
</thead>
<tbody id="stockTable"></tbody>
</table>

<h3>ประวัติการเบิก</h3>
<div id="useHistory"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ===== Firebase Init ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBo8aIL2e1XLdS4BeOPEreXaA3IyWDTiHY",
  authDomain: "stock-69302.firebaseapp.com",
  projectId: "stock-69302",
  storageBucket: "stock-69302.firebasestorage.app",
  messagingSenderId: "301831402512",
  appId: "1:301831402512:web:290a578b80c199314bc695"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ===== Data ===== */
let items = [];
let historyData = [];

/* ===== Realtime Listener ===== */
function listenRealtime(){
  db.collection("items").onSnapshot(snap=>{
    items = [];
    snap.forEach(doc=>{
      items.push({id:doc.id, ...doc.data()});
    });
    renderStock();
    updateDropdown();
  });

  db.collection("history").orderBy("time_ts","desc").onSnapshot(snap=>{
    historyData = [];
    snap.forEach(doc=>historyData.push(doc.data()));
    renderHistory();
  });
}

/* ===== Render ===== */
function renderStock(){
  const tb = document.getElementById("stockTable");
  tb.innerHTML="";
  items.forEach(x=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${x.name}</td>
      <td>${x.qty||0}</td>
      <td>${x.price||0}</td>
      <td>${(x.qty||0)*(x.price||0)}</td>
      <td><button data-id="${x.id}">ลบ</button></td>`;
    tr.querySelector("button").onclick=()=>{
      if(confirm("ลบสินค้า?")){
        db.collection("items").doc(x.id).delete();
      }
    };
    tb.appendChild(tr);
  });
}

function renderHistory(){
  const div=document.getElementById("useHistory");
  div.innerHTML="";
  historyData.forEach(x=>{
    const d=document.createElement("div");
    d.innerHTML=`• ${x.name} เบิก ${x.qty} โดย ${x.by} (${x.date})`;
    div.appendChild(d);
  });
}

function updateDropdown(){
  const sel=document.getElementById("use_name");
  sel.innerHTML="";
  items.forEach(x=>{
    const opt=document.createElement("option");
    opt.value=x.name;
    opt.textContent=`${x.name} (เหลือ ${x.qty||0})`;
    sel.appendChild(opt);
  });
}

/* ===== Actions ===== */
function saveItem(){
  const n=name.value.trim();
  if(!n) return alert("กรอกชื่อ");
  const q=Number(qty.value)||0;
  const p=Number(price.value)||0;
  const t=Number(threshold.value)||0;
  const d=date_add.value;
  const noteVal=note.value.trim();

  const found = items.find(x=>x.name===n);
  if(found){
    db.collection("items").doc(found.id).update({
      qty:(found.qty||0)+q, price:p, threshold:t, date_add:d, note:noteVal
    });
  }else{
    db.collection("items").add({
      name:n, qty:q, price:p, threshold:t, date_add:d, note:noteVal
    });
  }
}

function useItem(){
  const nameVal=use_name.value;
  const qtyVal=Number(use_qty.value)||0;
  const byVal=use_by.value.trim();
  const dateVal=use_date.value;
  const noteVal=use_note.value.trim();

  const item=items.find(x=>x.name===nameVal);
  if(!item || item.qty < qtyVal) return alert("สินค้าไม่พอ");

  db.collection("items").doc(item.id).update({
    qty:item.qty-qtyVal
  });

  db.collection("history").add({
    name:nameVal, qty:qtyVal, by:byVal,
    date:dateVal, note:noteVal,
    time:new Date().toLocaleString(),
    time_ts:firebase.firestore.FieldValue.serverTimestamp()
  });
}

/* ===== Init ===== */
document.getElementById("btnSaveItem").onclick=saveItem;
document.getElementById("btnUseItem").onclick=useItem;
listenRealtime();
</script>

</body>
</html>
