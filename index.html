<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ================= Firebase Init ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBo8aIL2e1XLdS4BeOPEreXaA3IyWDTiHY",
  authDomain: "stock-69302.firebaseapp.com",
  projectId: "stock-69302",
  storageBucket: "stock-69302.firebasestorage.app",
  messagingSenderId: "301831402512",
  appId: "1:301831402512:web:290a578b80c199314bc695"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= Data ================= */
var items = [];
var historyData = [];

/* ================= Popup ================= */
function showPopup(title, content, isHtml){
  document.getElementById("popupTitle").innerText = title || "แจ้งเตือน";
  var body = document.getElementById("popupBody");
  body[isHtml ? "innerHTML" : "innerText"] = content;
  document.getElementById("popupOverlay").style.display = "flex";
}
function hidePopup(){
  document.getElementById("popupOverlay").style.display = "none";
}

/* ================= Firestore Realtime ================= */
function listenRealtime(){
  db.collection("items").onSnapshot(snap=>{
    items = [];
    snap.forEach(doc=>{
      items.push({ id: doc.id, ...doc.data() });
    });
    updateDropdown();
    renderStock();
    renderDashboard();
  });

  db.collection("history").orderBy("time","asc").onSnapshot(snap=>{
    historyData = [];
    snap.forEach(doc=>{
      historyData.push(doc.data());
    });
    renderHistory();
  });
}

/* ================= Dropdown ================= */
function updateDropdown(){
  var sel = document.getElementById("use_name");
  sel.innerHTML = "";
  if(!items.length){
    var opt=document.createElement("option");
    opt.textContent="ยังไม่มีข้อมูลสต็อก";
    sel.appendChild(opt);
    return;
  }
  items.forEach(x=>{
    var opt=document.createElement("option");
    opt.value=x.name;
    opt.textContent = x.name+" (เหลือ "+(x.qty||0)+")";
    sel.appendChild(opt);
  });
}

/* ================= Render ================= */
function renderStock(){
  var tb=document.getElementById("stockTable");
  var keyword=(document.getElementById("search").value||"").toLowerCase();
  tb.innerHTML="";
  items.forEach((x,idx)=>{
    if(keyword && !x.name.toLowerCase().includes(keyword)) return;
    var tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${x.name}</td>
      <td class="text-right">${x.qty||0}</td>
      <td class="text-right">${Number(x.price||0).toFixed(2)}</td>
      <td class="text-right">${(Number(x.qty||0)*Number(x.price||0)).toFixed(2)}</td>
      <td class="text-right">${x.threshold||0}</td>
      <td>${x.date_add||"-"}</td>
      <td>${x.note||""}</td>
      <td>
        <button class="btn-primary btn-edit" data-id="${x.id}">แก้ไข</button>
        <button class="btn-outline btn-delete" data-id="${x.id}">ลบ</button>
      </td>`;
    tb.appendChild(tr);
  });
}

function renderDashboard(){
  var totalItems=items.length;
  var totalQty=items.reduce((s,x)=>s+Number(x.qty||0),0);
  var totalValue=items.reduce((s,x)=>s+Number(x.qty||0)*Number(x.price||0),0);
  var low=items.filter(x=>Number(x.qty||0)<=Number(x.threshold||0)&&Number(x.threshold||0)>0).length;
  stat_total_items.innerText=totalItems+" รายการ";
  stat_total_qty.innerText=totalQty+" ชิ้น";
  stat_total_value.innerText=totalValue.toFixed(2);
  stat_low_stock.innerText=low+" รายการ";
}

function renderHistory(){
  var div=useHistory;
  div.innerHTML="";
  if(!historyData.length){div.innerHTML="<i>ยังไม่มีประวัติการเบิก</i>";return;}
  historyData.slice().reverse().forEach(x=>{
    var box=document.createElement("div");
    box.className="history-card";
    box.innerHTML=`<b>${x.name}</b> — เบิก ${x.qty} ชิ้น<br>
    <span class="history-meta">
    ผู้เบิก: ${x.by}<br>
    วันที่เบิก: ${x.date}<br>
    หมายเหตุ: ${x.note||"-"}<br>
    บันทึกเมื่อ: ${x.time}</span>`;
    div.appendChild(box);
  });
}

/* ================= Actions ================= */
function saveItem(){
  var n=name.value.trim();
  if(!n) return showPopup("แจ้งเตือน","กรุณากรอกชื่ออุปกรณ์");
  var q=Number(qty.value)||0,p=Number(price.value)||0,t=Number(threshold.value)||0;
  var d=date_add.value, noteVal=note.value.trim();

  var found = items.find(x=>x.name===n);
  if(found){
    db.collection("items").doc(found.id).update({
      qty:(Number(found.qty)||0)+q, price:p, threshold:t, date_add:d, note:noteVal
    });
  }else{
    db.collection("items").add({name:n,qty:q,price:p,threshold:t,date_add:d,note:noteVal});
  }
  clearAddForm();
}

function useItem(){
  var nameVal=use_name.value;
  var qtyVal=Number(use_qty.value)||0;
  var byVal=use_by.value.trim();
  var dateVal=use_date.value;
  var noteVal=use_note.value.trim();
  var item=items.find(x=>x.name===nameVal);
  if(!item||item.qty<qtyVal) return showPopup("แจ้งเตือน","สินค้าไม่พอ");

  db.collection("items").doc(item.id).update({qty:item.qty-qtyVal});
  db.collection("history").add({
    name:nameVal,qty:qtyVal,by:byVal,date:dateVal,note:noteVal,
    time:new Date().toLocaleString(), time_ts:firebase.firestore.FieldValue.serverTimestamp()
  });
  clearIssueForm();
}

/* ================= Init ================= */
document.addEventListener("DOMContentLoaded",()=>{
  btnClosePopup.onclick=hidePopup;
  btnSaveItem.onclick=saveItem;
  btnUseItem.onclick=useItem;
  btnSummaryDay.onclick=()=>showSummary("day");
  btnSummaryMonth.onclick=()=>showSummary("month");
  search.oninput=renderStock;

  stockTable.onclick=e=>{
    var id=e.target.dataset.id;
    if(e.target.classList.contains("btn-delete")){
      if(confirm("ลบข้อมูล?")) db.collection("items").doc(id).delete();
    }
  };

  setupNav();
  listenRealtime();
});
</script>
